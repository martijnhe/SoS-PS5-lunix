name: build

# Every commit: the Linux and Steam Deck AppImages and the full source (with submodules), as a
# pre-release named after the commit. The game is not included: players use their own copy.
on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-14 cmake ninja-build pkg-config python3 nasm patchelf squashfs-tools file desktop-file-utils \
            libgtk-3-dev libvulkan-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev
      - name: Source archive
        run: |
          short=${GITHUB_SHA::7}
          echo "VERSION=0.4.1-$short" >> "$GITHUB_ENV"
          mkdir -p out
          tar --exclude=.git --exclude=./out -czf "out/SonsOfSparta-PS5-source-0.4.1-$short.tar.gz" .
      - name: Build
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-linux --target libs relinker SonsOfSparta-PS5
      - name: Package
        run: |
          # The end of the log goes in an annotation, which can be read without signing in.
          if ! {
            set -ex
            tools/package_linux.sh "$VERSION"
            curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x /tmp/appimagetool
            APPIMAGETOOL=/tmp/appimagetool tools/make_appimage.sh "release/SonsOfSparta-PS5-Native-$VERSION-linux-x86_64" out "$VERSION"
          } > package.log 2>&1; then
            echo "::error title=Packaging failed::$(tail -25 package.log | cut -c1-200 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          tail -5 package.log
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: SonsOfSparta-PS5-${{ env.VERSION }}
          path: out/*
          compression-level: 0
      - name: Publish for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=${GITHUB_SHA::7}
          gh release create "commit-$short" out/* --target "$GITHUB_SHA" --prerelease \
            --title "Build $short" --notes "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}. Bring your own game: see docs/user/LINUX.md."
